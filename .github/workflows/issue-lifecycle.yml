name: Issue lifecycle

# DISABLED IN aukora-x7: the automatic triggers of this workflow are commented out below, unchanged, until this
# repository has its own runners, secrets and Cloudflare account. Only manual dispatch remains (GitHub needs one trigger).
on:
  workflow_dispatch:
# [disabled in aukora-x7]   issues:
# [disabled in aukora-x7]     types:
# [disabled in aukora-x7]       - opened
# [disabled in aukora-x7]       - edited
# [disabled in aukora-x7]       - labeled
# [disabled in aukora-x7]       - unlabeled
# [disabled in aukora-x7]       - closed
# [disabled in aukora-x7]       - reopened
# [disabled in aukora-x7]       - typed
# [disabled in aukora-x7]       - untyped
# [disabled in aukora-x7]       - field_added
# [disabled in aukora-x7]       - field_removed
# [disabled in aukora-x7]   pull_request:
# [disabled in aukora-x7]     types:
# [disabled in aukora-x7]       - opened
# [disabled in aukora-x7]       - edited
# [disabled in aukora-x7]       - reopened
# [disabled in aukora-x7]       - review_requested
# [disabled in aukora-x7]   pull_request_review:
# [disabled in aukora-x7]     types:
# [disabled in aukora-x7]       - submitted

permissions:
  contents: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    if: >-
      (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') &&
      (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create project token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
          owner: deepseek-harness
          repositories: deepseek-harness
      - name: Handle repository event
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/issue-management/policy.mjs lifecycle
