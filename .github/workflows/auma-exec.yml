name: Auma exec (one command on a throwaway runner; no secrets, no deploy)

# Auma's hands. Her exec door (deploy/cloudflare/src/cloud-brokers.mjs execDoor, her tool x6_exec)
# dispatches this workflow on main with a command she wrote; it runs on a fresh GitHub-hosted machine and is thrown away.
#   - It holds NO secret and NO write permission: `contents: read` only, and the checkout keeps no credential. What the
#     command changes never comes back by itself: she prints a diff or writes files under $ARTIFACTS, and commits through
#     x6_repo. main cannot be moved from here; a merge is still the owner's passkey on her proposal card.
#   - Every input reaches a shell only through `env:`, never as `${{ inputs.* }}` inside a script (script injection).
#     deploy/ci/auma-exec-workflow.test.mjs holds that, the permissions and the input bounds.
#   - The inputs are validated twice: by the edge before it dispatches (closed refusal codes) and here, first, fail closed.
#   - Her command never runs as the runner user. That user has passwordless sudo and owns what later steps run (the
#     actions under _actions, GITHUB_ENV, the runner's own memory), and this run is in main's scope: it could reach the
#     Actions runtime credential and write cache entries that main's other workflows restore beside the keys they hold. So
#     the command, and everything later that reads what she left, runs as `auma`, a user made here with no sudo and no
#     group, on her own copy of the checkout in her home. Before anything of hers is read back as the runner, every process
#     of hers is stopped and only her plain files and folders are kept (no link can point the upload at a runner file).
#   - the body users (2026-11-16): two more users,
#     `body_a` and `body_b`, each as powerless as she is (no sudo, no group but its own, a home nobody else may enter).
#     She may start a process as one of them and as nobody else. A fixture that must show "the old body is refused"
#     needs the operating system, not a convention, to keep two bodies and her own files apart. Each body has a folder
#     `/home/auma/bodies/<body>` that it and she may use and the other body may not. Their processes are stopped with hers.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "main, or one of her branches auma/sandbox/<slug> or auma/proposal/<slug>"
        required: true
        type: string
      command:
        description: "the bash command, at most 4,096 characters, run with bash -eo pipefail in the repository root"
        required: true
        type: string
      timeout_minutes:
        description: "1 to 30"
        required: false
        default: "10"
        type: string
      browser:
        description: "true adds headless Chromium for the pinned Playwright"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      label:
        description: "1 to 64 of A-Z a-z 0-9 . _ - (in the run name, so she can find her run)"
        required: true
        type: string

run-name: auma-exec ${{ inputs.label }} @ ${{ inputs.ref }}

permissions:
  contents: read

# One run at a time per branch. `queue: max` keeps every waiting run (GitHub holds up to 100, first in, first out, as
# deploy-x61.yml does); without it a third run would cancel the one waiting.
concurrency:
  group: auma-exec-${{ inputs.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  exec:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      - name: Validate the inputs (fail closed)
        env:
          AUMA_REF: ${{ inputs.ref }}
          AUMA_COMMAND: ${{ inputs.command }}
          AUMA_TIMEOUT: ${{ inputs.timeout_minutes }}
          AUMA_BROWSER: ${{ inputs.browser }}
          AUMA_LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          fail() { echo "::error::AUMA_EXEC_INPUT_INVALID: $1"; exit 1; }
          [[ "$AUMA_REF" =~ ^(main|auma/(sandbox|proposal)/[a-z0-9][a-z0-9._-]{1,60})$ ]] || fail ref
          [[ "$AUMA_REF" != *..* && "$AUMA_REF" != *. && "$AUMA_REF" != *.lock ]] || fail ref
          [ -n "${AUMA_COMMAND//[[:space:]]/}" ] || fail command
          [ "${#AUMA_COMMAND}" -le 4096 ] || fail command
          [[ "$AUMA_TIMEOUT" =~ ^[1-9][0-9]?$ ]] && [ "$AUMA_TIMEOUT" -ge 1 ] && [ "$AUMA_TIMEOUT" -le 30 ] || fail timeout_minutes
          [[ "$AUMA_BROWSER" == "true" || "$AUMA_BROWSER" == "false" ]] || fail browser
          [[ "$AUMA_LABEL" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || fail label
          echo "inputs valid: ref $AUMA_REF, timeout $AUMA_TIMEOUT min, browser $AUMA_BROWSER, label $AUMA_LABEL, command ${#AUMA_COMMAND} characters"

      - name: Checkout the ref (no credential kept)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Runs as the runner, so nothing of her branch may execute here: no lifecycle script and no pnpmfile hook.
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      # The hosted image has no `rg` (first real run, 2026-11-14: exit 127). It comes from the image's own package index and
      # is installed by the runner, before her user exists; nothing of her branch is read here. A run where the index cannot
      # be reached goes on without it and says so, instead of failing her command for a search tool.
      - name: Install ripgrep (rg) from the image's package index
        run: |
          set -uo pipefail
          if [ ! -x /usr/bin/rg ]; then
            for attempt in 1 2; do
              if sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep; then break; fi
              sleep 3
            done
          fi
          if [ -x /usr/bin/rg ]; then /usr/bin/rg --version; else echo "::warning::ripgrep could not be installed: rg is missing in this run"; fi

      # As observe-x61.yml installs it: the pinned Playwright, integrity-checked, outside the checkout; then Chromium. Both
      # go under /opt, where her user can read them and cannot write.
      - name: Install integrity-pinned Playwright and Chromium (browser only)
        if: ${{ inputs.browser == 'true' }}
        env:
          PW_DIR: /opt/x61-playwright
          PLAYWRIGHT_BROWSERS_PATH: /opt/x61-playwright/browsers
        run: |
          set -euo pipefail
          sudo mkdir -p "$PW_DIR"
          sudo chown "$(id -u):$(id -g)" "$PW_DIR"
          mkdir -p "$PW_DIR/tarballs" "$PW_DIR/node_modules/playwright" "$PW_DIR/node_modules/playwright-core"
          fetch_pinned() {
            local file="$PW_DIR/tarballs/$1-$2.tgz"
            curl -fsSL --proto '=https' --tlsv1.2 -o "$file" "https://registry.npmjs.org/$1/-/$1-$2.tgz"
            local got="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
            if [ "$got" != "$3" ]; then echo "::error::$1@$2 tarball integrity mismatch"; exit 1; fi
            tar -xzf "$file" -C "$PW_DIR/node_modules/$1" --strip-components=1 --no-same-owner
          }
          fetch_pinned playwright-core 1.61.1 'sha512-h7Qlt6m4REp25qvIdvbDtVmD4LqVXfpRxhORv9L0jzETM05p4fuPJ3dKyuSXQxDSbXnmS79HAgi9589lGSpLkg=='
          fetch_pinned playwright 1.61.1 'sha512-DWnY5o3YbLWK4GovuAVwpqL+1VwGNdUGrRr++8j8PtQQzvAVZUIMjKQ90fY689sEJZJBbZVw1rXaOKSTitkzPQ=='
          node "$PW_DIR/node_modules/playwright/cli.js" install --with-deps chromium
          echo "X61_PLAYWRIGHT_DIR=$PW_DIR" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

      # Her user: no sudo, no group but her own, links protected; the checkout moves into her home, her pnpm and PATH stay
      # outside the runner's home, and $ARTIFACTS is a folder of hers.
      - name: Make her user (no sudo) and give her the checkout
        run: |
          set -euo pipefail
          [ "$(cat /proc/sys/fs/protected_hardlinks)" = 1 ] && [ "$(cat /proc/sys/fs/protected_symlinks)" = 1 ] || { echo "::error::link protection is off"; exit 1; }
          sudo useradd --create-home --home-dir /home/auma --shell /bin/bash --user-group auma
          case "$(sudo -n -l -U auma 2>&1)" in *"may run the following"*) echo "::error::auma may use sudo"; exit 1 ;; esac
          [ "$(id -nG auma)" = auma ] || { echo "::error::auma is in another group"; exit 1; }
          sudo chmod 755 /home/auma
          sudo mv "$GITHUB_WORKSPACE" /home/auma/repo
          mkdir -p "$GITHUB_WORKSPACE"
          sudo mkdir -p /home/auma/artifacts
          sudo chown -R auma:auma /home/auma/repo /home/auma/artifacts
          real="$(readlink -f "$(command -v pnpm)")"
          package="$(dirname "$(dirname "$real")")"
          sudo mkdir -p /opt/auma-tools/bin
          sudo cp -a "$package" /opt/auma-tools/pnpm
          printf '#!/bin/sh\nexec /opt/auma-tools/pnpm/%s "$@"\n' "${real#"$package"/}" | sudo tee /opt/auma-tools/bin/pnpm >/dev/null
          sudo chmod -R a+rX,go-w /opt/auma-tools
          sudo chmod 755 /opt/auma-tools/bin/pnpm
          her_path=/opt/auma-tools/bin
          IFS=: read -ra parts <<< "$PATH"
          for dir in "${parts[@]}"; do case "$dir" in "" | "$HOME" | "$HOME"/*) ;; *) her_path="$her_path:$dir" ;; esac; done
          echo "AUMA_PATH=$her_path" >> "$GITHUB_ENV"

      # the body users: the two body users. Checked the way hers is: no sudo, no other group. Then one sudoers line, and three
      # checks of what it really allows: she can become each body, she cannot become root, she cannot become the runner.
      - name: Make two body users for her fixtures (no sudo; she may run as them and as nobody else)
        run: |
          set -euo pipefail
          sudo mkdir -p /home/auma/bodies
          sudo chown auma:auma /home/auma/bodies
          sudo chmod 755 /home/auma/bodies
          for body in body_a body_b; do
            sudo useradd --create-home --home-dir "/home/$body" --shell /bin/bash --user-group "$body"
            case "$(sudo -n -l -U "$body" 2>&1)" in *"may run the following"*) echo "::error::$body may use sudo"; exit 1 ;; esac
            [ "$(id -nG "$body")" = "$body" ] || { echo "::error::$body is in another group"; exit 1; }
            sudo chmod 700 "/home/$body"
            sudo mkdir -p "/home/auma/bodies/$body"
            sudo chown "$body:auma" "/home/auma/bodies/$body"
            sudo chmod 2770 "/home/auma/bodies/$body"
          done
          printf 'auma ALL=(body_a,body_b) NOPASSWD: ALL\n' | sudo tee /etc/sudoers.d/auma-bodies >/dev/null
          sudo chmod 440 /etc/sudoers.d/auma-bodies
          sudo visudo -cf /etc/sudoers.d/auma-bodies
          sudo -u auma sudo -n -u body_a true
          sudo -u auma sudo -n -u body_b true
          if sudo -u auma sudo -n true 2>/dev/null; then echo "::error::auma may become root"; exit 1; fi
          if sudo -u auma sudo -n -u "$(id -un)" true 2>/dev/null; then echo "::error::auma may become the runner"; exit 1; fi
          if sudo -u body_a sudo -n -u body_b true 2>/dev/null; then echo "::error::a body may become the other body"; exit 1; fi
          if sudo -u body_a test -r /home/auma/bodies/body_b; then echo "::error::a body can read the other body's folder"; exit 1; fi

      # The command arrives only through env (never interpolated into this script) and runs, as auma, in her checkout.
      - name: Run her command
        id: command
        env:
          AUMA_COMMAND: ${{ inputs.command }}
        run: |
          cd /home/auma/repo
          set +e
          sudo -u auma env -i PATH="$AUMA_PATH" HOME=/home/auma LANG=C.UTF-8 CI=true ARTIFACTS=/home/auma/artifacts X61_PLAYWRIGHT_DIR="${X61_PLAYWRIGHT_DIR:-}" PLAYWRIGHT_BROWSERS_PATH="${PLAYWRIGHT_BROWSERS_PATH:-}" bash -eo pipefail -c "$AUMA_COMMAND"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # git reads her checkout as auma: its config is hers, and as the runner it could start a program of hers.
      - name: Report the exit code and what changed
        if: always()
        env:
          AUMA_EXIT_CODE: ${{ steps.command.outputs.code }}
        run: |
          echo "AUMA_EXIT_CODE=${AUMA_EXIT_CODE:-none}"
          if [ -d /home/auma/repo/.git ]; then
            cd /home/auma/repo
            sudo -u auma env -i PATH=/usr/bin:/bin HOME=/home/auma git status --short | head -200
            sudo -u auma env -i PATH=/usr/bin:/bin HOME=/home/auma git diff --stat | tail -50
          fi

      # Her account is locked and every process of hers is stopped (by her user id, on this throwaway machine) before the
      # runner reads anything she wrote; then only her plain files and folders are copied for the upload.
      - name: Stop her processes and keep only her plain files
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          for body in body_a body_b; do
            if id "$body" >/dev/null 2>&1; then
              sudo usermod --lock --expiredate 1 "$body"
              for attempt in 1 2 3 4 5; do
                if ! pgrep -u "$body" >/dev/null && ! pgrep -U "$body" >/dev/null; then break; fi
                if sudo pkill -KILL -u "$body"; then :; fi
                if sudo pkill -KILL -U "$body"; then :; fi
                sleep 1
              done
              if pgrep -u "$body" >/dev/null || pgrep -U "$body" >/dev/null; then echo "::error::a process of $body is still running"; exit 1; fi
            fi
          done
          sudo rm -f /etc/sudoers.d/auma-bodies
          if id auma >/dev/null 2>&1; then
            sudo usermod --lock --expiredate 1 auma
            if sudo crontab -l -u auma >/dev/null 2>&1; then sudo crontab -r -u auma; fi
            for attempt in 1 2 3 4 5; do
              if ! pgrep -u auma >/dev/null && ! pgrep -U auma >/dev/null; then break; fi
              if sudo pkill -KILL -u auma; then :; fi
              if sudo pkill -KILL -U auma; then :; fi
              sleep 1
            done
            if pgrep -u auma >/dev/null || pgrep -U auma >/dev/null; then echo "::error::a process of hers is still running"; exit 1; fi
            if [ -d /home/auma/artifacts ]; then
              sudo find /home/auma/artifacts -mindepth 1 ! -type f ! -type d -delete
              sudo cp -R /home/auma/artifacts/. "$RUNNER_TEMP/artifacts/"
              sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/artifacts"
            fi
          fi

      - name: Upload her artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auma-exec-artifacts
          path: ${{ runner.temp }}/artifacts
          retention-days: 3
          if-no-files-found: ignore
