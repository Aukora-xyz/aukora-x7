# TEMPLATE. Every node operator sets name, account_id, routes, PUBLIC_HOST, ACCESS_TEAM, ACCESS_AUD, OWNER_EMAIL,
# OWNER_PUBLIC_KEY_HEX and the R2 bucket_name for their own Cloudflare account before the first deploy. The values
# below are placeholders: the all-zero account id matches no account, so the deploy workflow refuses
# (ACCOUNT_MISMATCH) until it is set.
name = "your-node"
main = "src/worker.mjs"
compatibility_date = "2026-11-01"
account_id = "00000000000000000000000000000000"
workers_dev = false
preview_urls = false
routes = [{ pattern = "node.example.invalid", custom_domain = true }]

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[vars]
PUBLIC_HOST = "node.example.invalid"
ACCESS_TEAM = "your_team.cloudflareaccess.com"
ACCESS_AUD = ""
OWNER_EMAIL = ""
# Thread sync is ON. The boot document
# then tells her app to run it (thread-sync-mode.mjs): a browser that never saved her becomes a read-only reader instead of
# a second writer, and her one writer browser may copy each thread's new lines to her cloud (thread-writer.ts). Her own
# Chrome is not an eligible writer until her sender card lands (its mirror fence is out of step); until then this sends nothing.
THREAD_SYNC = "on"
# How many bytes of conversation lines her cloud accepts per UTC day (world-budget.mjs; the default is
# 128 MiB). A browser may hold hundreds of MB of conversations its cloud was never sent: at the default its first
# copy would stop at 128 MiB and every new turn after it would be refused until the next UTC midnight. 1 GiB a day; the
# world's total (2 GiB, VAULT_MAX_BYTES unset) is unchanged. The owner changes this line.
THREAD_DAY_BYTES = "1073741824"
# When her browser is out of step with her cloud's whole-home copy, nothing of her home but her conversations reaches
# her cloud.
# "chrome-wins": at her next boot her browser moves to her cloud's version, keeps every one of its own bytes (a backup
# row is kept of anything it adopts from her cloud, and of her cloud's bytes it overrides), and then sends everything it
# holds; her browser's copy wins. Never deletes. Values: unset (off), "report", "apply", "chrome-wins" (mirror-do.mjs).
MIRROR_REBASE = "chrome-wins"
OWNER_PUBLIC_KEY_HEX = ""
SOURCE_REVISION = "0000000000000000000000000000000000000000"
PROVIDER_BUDGET_WINDOW_MS = "60000"
PROVIDER_BUDGET_REQUESTS = "1000"
PROVIDER_BUDGET_TOKENS = "50000000"
PROVIDER_MAX_OUTPUT_TOKENS = "256000"
# Her Prime Intellect door (docs/auma/prime-door.md).
# The account's own balance is the brake. The two prices are set at the
# dearest model Prime lists (every listed model is allowed) and the two caps are set far out of the way; the door still
# counts an upper estimate against them. The owner changes these four lines. The key (PRIME_API_KEY) is a Worker secret.
PRIME_DAILY_CAP_USD = "1000"
PRIME_MONTHLY_CAP_USD = "10000"
PRIME_PRICE_IN_PER_M_USD = "10"
PRIME_PRICE_OUT_PER_M_USD = "50"
ELEVENLABS_MAX_CHARS_PER_DAY = "100000"
ELEVENLABS_MAX_COST_PER_DAY = "4"
ELEVENLABS_PRICE_PER_1K_CHARS = "0.04"
ELEVENLABS_CHARS_PER_PASS = "5000"
# Her voice in Auma Live: ELEVENLABS_VOICE_ID is not set in this template. A deployer sets their own voice id, as a
# [vars] line here or as a Worker secret; an empty value is refused (eleven-speech.test.mjs). The key is always a secret.
CLOUDFLARE_DOOR_LEVEL = "open" # the owner's choice; the other value is "guarded"
LINEAR_DOOR_LEVEL = "open" # the owner's choice; the other value is "guarded" (every write asks)
# The managed voice (VoiceBridge, docs/auma/voice-bridge.md). Only exactly "1" turns it on. Since 2026-11-14 it is the only voice:
# "0" means NO voice (the orb rests with "My voice is not set up on this host yet. Typing works."); no older voice comes back.
# ON: the provider resource is set up.
VOICE_MANAGED = "1"
# Her fast voice's provider (voice-fast.mjs FAST_VOICE_PROVIDERS; docs/auma/voice-bridge.md).
# History: this was first pointed at Claude (claude-fable-5-2, effort low). A name, not
# a secret: the key stays the Worker secret ANTHROPIC_API_KEY, which only HEAD's dispatcher reads. While that binding is
# not set, the fast voice is off with provider-not-configured and the governed path answers every turn.
# DeepSeek is the default for every voice turn, with Claude only as the fallback. Reason: once, every one of 24 voice
# turns in a row came back handed/cancelled with reason provider_status and path fast_fell_back (the Claude seat's
# account refused the calls), so the fast brain was failing on nearly every utterance.
# The model string for each provider lives in voice-fast.mjs FAST_VOICE_PROVIDERS; this variable chooses the provider only.
VOICE_FAST_PROVIDER = "deepseek"
# Her early "mm-hm" / "hmm" 2.5 s into a turn that has said nothing yet.
# Only exactly "on" says it.
# Her other cues are not touched ("one sec, looking", the work cues, the provider-wait "one sec", the deep-turn lines).
VOICE_EARLY_CUE = "off"
# Her wake (docs/auma/wake.md): bounded read-only steps on a wish while no browser tab is open. Only exactly "1" turns it on.
# ON: she may work with his tab closed. A step still needs a wish she made; 24 steps a wish,
# 48 a UTC day. The provider is named, never swapped: with its secret absent no step runs (PROVIDER_SECRET_NOT_CONFIGURED).
WAKE_EXECUTOR_ENABLED = "1"
CLOUD_WAKE_PROVIDER = "deepseek"
# Her no-tab ACTS (branch, commit or patch on her own branches, a runner job, a proposal card, one Linear comment),
# each paid from the owner's away mandate first, offered only while his mandate is active. Only exactly "1" offers them;
# anything else keeps every step look-only. Nothing on this path merges, deploys, deletes or touches a secret.
# Committed "0" (every step stays look-only) until two read-only no-tab steps, a clean stop and right
# counts have been shown on the live build. Then this becomes "1" in a commit of its own.
WAKE_ACTS_ENABLED = "1"
# Her outside witness (docs/auma/outside-witness.md) is ON in the shipped configuration (each request carries the
# node's domain name). Only exactly "on" runs it; the other value is "off" (anything else is off too).
WITNESS_SWITCH = "on"
# Complete KV copies after the hourly witness tick; 19:00 UTC begins the nightly window.
NIGHTLY_COPY = "on"
# Promotion records: GET /api/witness/record?seq=n would show anyone one whole witness record: her head id and epoch, the receipt count
# and newest receipt digest, the two memory chain files' sizes and newest-line digests, the missing list (no words), and,
# on a v 2 record (every record since the nightly commitment), the newest complete nightly set's name and its manifest's SHA-256. The
# owner has not yet said yes to showing those counts and fingerprints to everyone, so it ships "off" (404); only "on" serves it.
WITNESS_RECORD_PUBLIC = "off"
# A second timestamp of another kind (RFC 3161). Each new witness record (and one older record an hour) is sent to
# ONE host, https://freetsa.org/tsr, which receives the record's 32-byte digest and a random 8-byte nonce, nothing else.
# Its reply is stored and only sanity-read: the edge does not check the token's signature. Only exactly "on" sends it.
WITNESS_TSA = "on"

# One bounded witness tick each hour, at minute 17. A new record is made only every 4 hours.
[triggers]
crons = ["17 * * * *"]

[[durable_objects.bindings]]
name = "HEAD"
class_name = "X61HeadDurableObject"

[[durable_objects.bindings]]
name = "MIRROR"
class_name = "MirrorDO"

[[durable_objects.bindings]]
name = "VOICE_BRIDGE"
class_name = "VoiceBridgeDO"

# Her outside witness. Its own object, so a witness defect cannot touch HEAD's or the
# mirror's storage; it alone stores witness state and makes the outbound calls (four calendars, five relays).
[[durable_objects.bindings]]
name = "WITNESS"
class_name = "WitnessDO"

[[r2_buckets]]
binding = "ARCHIVE_BUCKET"
bucket_name = "your-node-archive"

[[migrations]]
tag = "x61-v1"
new_sqlite_classes = ["X61HeadDurableObject", "MirrorDO"]

# A class lifecycle change blocks `wrangler rollback` across it: deploy this migration with nothing else changed.
[[migrations]]
tag = "x61-v2-voice-bridge"
new_sqlite_classes = ["VoiceBridgeDO"]

# The witness object. Like x61-v2, a class lifecycle change blocks `wrangler rollback` across it.
[[migrations]]
tag = "x61-v3-witness"
new_sqlite_classes = ["WitnessDO"]
